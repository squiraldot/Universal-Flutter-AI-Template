name: Initialize New App

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: Human-readable application name
        required: true
        type: string
      dart_package_name:
        description: Lowercase Dart package name (for example, lifebit)
        required: true
        type: string
      android_application_id:
        description: Reverse-domain Android application ID
        required: true
        type: string
      ios_bundle_id:
        description: Reverse-domain iOS bundle identifier (defaults to Android ID)
        required: false
        type: string
      dry_run:
        description: Preview changes without modifying the project or building artifacts
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: initialize-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout template
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Generate Android, iOS and Web scaffolds
        run: bash scripts/bootstrap.sh

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Preview app identity changes
        env:
          APP_NAME: ${{ inputs.app_name }}
          DART_PACKAGE_NAME: ${{ inputs.dart_package_name }}
          ANDROID_APPLICATION_ID: ${{ inputs.android_application_id }}
          IOS_BUNDLE_ID: ${{ inputs.ios_bundle_id }}
        run: |
          args=()
          if [[ -n "$IOS_BUNDLE_ID" ]]; then args+=(--ios-bundle-id "$IOS_BUNDLE_ID"); fi
          bash scripts/init_app.sh --dry-run "${args[@]}" "$APP_NAME" "$DART_PACKAGE_NAME" "$ANDROID_APPLICATION_ID" | tee initialization-plan.txt

      - name: Apply app identity
        if: ${{ !inputs.dry_run }}
        env:
          APP_NAME: ${{ inputs.app_name }}
          DART_PACKAGE_NAME: ${{ inputs.dart_package_name }}
          ANDROID_APPLICATION_ID: ${{ inputs.android_application_id }}
          IOS_BUNDLE_ID: ${{ inputs.ios_bundle_id }}
        run: |
          args=()
          if [[ -n "$IOS_BUNDLE_ID" ]]; then args+=(--ios-bundle-id "$IOS_BUNDLE_ID"); fi
          bash scripts/init_app.sh "${args[@]}" "$APP_NAME" "$DART_PACKAGE_NAME" "$ANDROID_APPLICATION_ID"

      - name: Run initializer safety tests
        if: ${{ !inputs.dry_run }}
        run: bash scripts/tests/init_app_test.sh

      - name: Resolve dependencies after package rename
        if: ${{ !inputs.dry_run }}
        run: flutter pub get

      - name: Generate localization
        if: ${{ !inputs.dry_run }}
        run: flutter gen-l10n

      - name: Check Dart formatting
        if: ${{ !inputs.dry_run }}
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Dart code
        if: ${{ !inputs.dry_run }}
        run: flutter analyze

      - name: Run Flutter tests
        if: ${{ !inputs.dry_run }}
        run: flutter test

      - name: Build debug APK
        if: ${{ !inputs.dry_run }}
        run: flutter build apk --debug

      - name: Build Web release bundle
        if: ${{ !inputs.dry_run }}
        run: flutter build web --release

      - name: Package initialized source
        id: package-source
        if: ${{ !inputs.dry_run }}
        run: |
          archive_path="$RUNNER_TEMP/initialized-app-source.tar.gz"
          tar -czf "$archive_path" --exclude=.git --exclude=.dart_tool --exclude=build --exclude=third_party/flutter -C "$GITHUB_WORKSPACE" .
          echo "archive_path=$archive_path" >> "$GITHUB_OUTPUT"

      - name: Upload initialization preview
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: initialization-preview-${{ github.run_number }}
          path: initialization-plan.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload initialized source
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: initialized-app-source-${{ github.run_number }}
          path: ${{ steps.package-source.outputs.archive_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: initialized-app-debug-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Web release bundle
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: initialized-app-web-build-${{ github.run_number }}
          path: build/web/
          if-no-files-found: error
          retention-days: 14
