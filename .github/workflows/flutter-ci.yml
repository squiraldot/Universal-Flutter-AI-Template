name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-web-quality:
    name: Format, Analyze, Test, Android & Web
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Bootstrap Android, iOS and Web scaffolds
        run: bash scripts/bootstrap.sh

      - name: Resolve packages and generate localization
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Test app initializer
        run: bash scripts/tests/init_app_test.sh

      - name: Show canonical Dart formatting for remaining files
        run: dart format --output=show lib/core/routing/unknown_route_page.dart test/core/config/app_environment_test.dart

      - name: Show canonical formatting for sample feature and tests
        run: |
          dart format --output=show lib/features/sample_tasks/presentation/sample_tasks_page.dart test/core/logging/app_error_reporting_test.dart test/core/routing/app_router_test.dart test/features/home/home_page_test.dart test/features/sample_tasks/application/sample_tasks_controller_test.dart test/features/sample_tasks/presentation/sample_tasks_page_test.dart

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests with coverage
        run: flutter test --coverage

      - name: Enforce minimum Dart line coverage
        run: bash scripts/check_coverage.sh

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build Web release bundle
        run: flutter build web --release

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: universal-flutter-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload Web release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: universal-flutter-web-build
          path: build/web/
          if-no-files-found: error

  ios-build:
    name: Build iOS (unsigned)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Bootstrap platform scaffolds
        run: bash scripts/bootstrap.sh

      - name: Build iOS without code signing
        run: flutter build ios --no-codesign
