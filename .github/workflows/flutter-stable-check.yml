name: Check Flutter stable release

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: flutter-stable-check
  cancel-in-progress: false

jobs:
  check-stable:
    name: Check for a newer Flutter stable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compare pinned Flutter with latest stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pinned_version="$(sed -n "s/.*flutter-version: '\([^']*\)'.*/\1/p" .github/workflows/flutter-ci.yml | head -n 1)"
          if [[ -z "$pinned_version" ]]; then
            echo "Could not read the pinned Flutter version from flutter-ci.yml." >&2
            exit 1
          fi

          latest_tag="$(gh api repos/flutter/flutter/releases/latest --jq '.tag_name')"
          latest_version="${latest_tag#v}"
          if [[ -z "$latest_version" ]]; then
            echo "Flutter stable release API returned an empty tag." >&2
            exit 1
          fi

          if [[ "$(printf '%s\n%s\n' "$pinned_version" "$latest_version" | sort -V | tail -n 1)" != "$latest_version" || "$latest_version" == "$pinned_version" ]]; then
            echo "Pinned Flutter $pinned_version is current (latest stable: $latest_version)."
            exit 0
          fi

          issue_title="Flutter stable update available: $latest_version"
          existing_issue="$(gh issue list --state open --search "in:title $issue_title" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing_issue" ]]; then
            echo "An update issue is already open: #$existing_issue"
            exit 0
          fi

          cat > "$RUNNER_TEMP/flutter-stable-update.md" <<EOF
          The repository currently pins Flutter **$pinned_version** in `.github/workflows/flutter-ci.yml`.

          The latest stable Flutter release is **$latest_version**.

          This is a review reminder only. No SDK files, submodules, workflow pins, dependencies or lockfiles were changed.

          Before updating, review the Flutter release notes and compatibility, update the pinned SDK deliberately, then run the documented format, analyze, test and platform build checks.
          EOF
          gh issue create --title "$issue_title" --body-file "$RUNNER_TEMP/flutter-stable-update.md"
